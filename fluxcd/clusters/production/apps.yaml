---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
  - name: core
  - name: core-resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/apps/production
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
    - kind: Secret
      name: cluster-vars
  patches:
  - target:
      kind: postgresql
    patch: |-
      apiVersion: acid.zalan.do/v1
      kind: postgresql
      metadata:
        name: all
      spec:
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              application: spilo
