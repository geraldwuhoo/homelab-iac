- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf app-matrix
    group: !KeyOf group-users
    order: 0

- model: authentik_providers_saml.samlprovider
  id: provider-nextcloud
  identifiers:
    name: nextcloud-saml
  attrs:
    authorization_flow: *authz_flow
    invalidation_flow: *invalidation_flow
    acs_url: https://cloud.${DOMAIN}/apps/user_saml/saml/acs
    audience: https://cloud.${DOMAIN}/apps/user_saml/saml/metadata
    issuer_override: https://cloud.${DOMAIN}/apps/user_saml/saml/metadata
    sp_binding: post
    sls_binding: redirect
    logout_method: frontchannel_iframe
    assertion_valid_not_before: minutes=-5
    assertion_valid_not_on_or_after: minutes=5
    session_valid_not_on_or_after: minutes=86400
    default_name_id_policy: urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
    digest_algorithm: http://www.w3.org/2001/04/xmlenc#sha256
    signature_algorithm: http://www.w3.org/2001/04/xmldsig-more#rsa-sha256
    sign_assertion: true
    sign_response: false
    sign_logout_request: false
    sign_logout_response: false
    signing_kp: *signing_key
    verification_kp: !Find [authentik_crypto.certificatekeypair, [name, Nextcloud]]
    name_id_mapping: !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/uid]]
    property_mappings:
    - !KeyOf saml-nextcloud-admin
    - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
    - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/username]]
    - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/uid]]
    - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/ms-windowsaccountname]]
    - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/upn]]
    - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/name]]
- model: authentik_core.application
  identifiers:
    slug: nextcloud
  attrs:
    name: Nextcloud
    provider: !KeyOf provider-nextcloud
    meta_icon: https://${DOMAIN}/icons/svg/nextcloud.svg
    meta_launch_url: https://cloud.${DOMAIN}
    policy_engine_mode: any

