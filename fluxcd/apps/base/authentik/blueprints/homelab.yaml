- model: authentik_providers_proxy.proxyprovider
  id: provider-sonarr
  identifiers:
    name: sonarr-proxy
  attrs:
    authorization_flow: *authz_flow
    invalidation_flow: *invalidation_flow
    mode: proxy
    external_host: https://sonarr.${DOMAIN}
    internal_host: http://sonarr.media.svc.cluster.local:8989
    internal_host_ssl_validation: true
    intercept_header_auth: true
    basic_auth_enabled: true
    basic_auth_user_attribute: sonarr_user
    basic_auth_password_attribute: sonarr_password
    access_token_validity: hours=1
    refresh_token_validity: hours=1
    property_mappings: &proxy_scopes
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
