version: 1
metadata:
  name: homelab
entries:
- model: authentik_core.group
  id: group-users
  identifiers:
    name: Users
  attrs:
    is_superuser: false
- model: authentik_core.group
  id: group-app-admins
  identifiers:
    name: App Admins
  attrs:
    is_superuser: false
- model: authentik_core.group
  id: group-cluster-admins
  identifiers:
    name: Cluster Admins
  attrs:
    is_superuser: false
- model: authentik_core.group
  id: group-arr-users
  identifiers:
    name: arr Users
  attrs:
    is_superuser: false
    attributes:
      prowlarr_user: root
      prowlarr_password: !Env BLUEPRINT_ARR_PROWLARR_PASSWORD
      radarr_user: root
      radarr_password: !Env BLUEPRINT_ARR_RADARR_PASSWORD
      sonarr_user: root
      sonarr_password: !Env BLUEPRINT_ARR_SONARR_PASSWORD

- model: authentik_flows.flow
  id: flow-nomfa
  identifiers:
    slug: default-authentication-flow-nomfa
  attrs:
    name: default-authentication-flow-nomfa
    title: Welcome to ${DOMAIN}!
    designation: authentication
    authentication: none
    denied_action: message_continue
    layout: stacked
    policy_engine_mode: any
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !KeyOf flow-nomfa
    stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
    order: 10
  attrs:
    evaluate_on_plan: true
    re_evaluate_policies: false
    invalid_response_action: retry
    policy_engine_mode: any
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !KeyOf flow-nomfa
    stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
    order: 20
  attrs:
    evaluate_on_plan: true
    re_evaluate_policies: false
    invalid_response_action: retry
    policy_engine_mode: any
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !KeyOf flow-nomfa
    stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
    order: 100
  attrs:
    evaluate_on_plan: true
    re_evaluate_policies: false
    invalid_response_action: retry
    policy_engine_mode: any

- model: authentik_providers_saml.samlpropertymapping
  id: saml-nextcloud-admin
  identifiers:
    name: Nextcloud admin mapping
  attrs:
    saml_name: http://schemas.xmlsoap.org/claims/Group
    expression: |-
      for group in user.ak_groups.all():
          yield group.name
      if ak_is_group_member(request.user, name="App Admins"):
          yield "admin"

- model: authentik_providers_oauth2.oauth2provider
  id: provider-immich
  identifiers:
    name: immich-oauth
  attrs:
    authentication_flow: &authn_flow !Find [authentik_flows.flow, [slug, default-authentication-flow]]
    authorization_flow: &authz_flow !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: &invalidation_flow !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    client_type: confidential
    client_id: hcL7zQCGTGZea5lievEuJdNlUfLaeW46rI9LiSv4
    client_secret: !Env BLUEPRINT_OIDC_SECRET_IMMICH
    access_code_validity: hours=1
    access_token_validity: hours=1
    refresh_token_validity: days=30
    signing_key: &signing_key !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
    property_mappings: &oauth_scopes
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    redirect_uris:
    - matching_mode: strict
      redirect_uri_type: authorization
      url: https://photos.${DOMAIN}/auth/login
    - matching_mode: strict
      redirect_uri_type: authorization
      url: app.immich:///oauth-callback
    - matching_mode: strict
      redirect_uri_type: authorization
      url: https://photos.${DOMAIN}/user-settings
- model: authentik_core.application
  identifiers:
    slug: immich
  attrs:
    name: Immich
    provider: !KeyOf provider-immich
    meta_icon: https://${DOMAIN}/icons/svg/immich.svg
    meta_launch_url: https://photos.${DOMAIN}/
    policy_engine_mode: any

- model: authentik_providers_ldap.ldapprovider
  id: provider-jellyfin
  identifiers:
    name: jellyfin-ldap
  attrs:
    authorization_flow: !KeyOf flow-nomfa
    invalidation_flow: *invalidation_flow
    base_dn: DC=auth,DC=wuhoo,DC=xyz
    bind_mode: direct
    search_mode: cached
    mfa_support: true
    certificate: *signing_key
    uid_start_number: 2000
    gid_start_number: 4000
- model: authentik_core.application
  identifiers:
    slug: jellyfin
  attrs:
    name: Jellyfin
    provider: !KeyOf provider-jellyfin
    meta_icon: https://${DOMAIN}/icons/svg/jellyfin.svg
    meta_launch_url: https://jellyfin.${DOMAIN}
    policy_engine_mode: any

