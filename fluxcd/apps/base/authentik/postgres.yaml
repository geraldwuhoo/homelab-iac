---
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: authentik-postgres-cluster
  annotations:
    k8up.io/backup: "false"
spec:
  teamId: "authentik"
  volume:
    size: 10Gi
  numberOfInstances: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi
  users:
    # database owner
    authentik:
    - superuser
    - createdb
  databases:
    authentik: authentik
  postgresql:
    version: "17"
