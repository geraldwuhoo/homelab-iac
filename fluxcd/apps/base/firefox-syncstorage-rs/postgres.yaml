---
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: firefox-syncstorage-rs-postgres-cluster
  annotations:
    k8up.io/backup: "false"
spec:
  teamId: "firefox-syncstorage-rs"
  volume:
    size: 10Gi
  numberOfInstances: 1
  users:
    # database owner
    syncstorage: []
  databases:
    syncstorage: syncstorage
  postgresql:
    version: "18"
