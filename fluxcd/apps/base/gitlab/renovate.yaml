---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: gitlab
spec:
  chart:
    spec:
      chart: renovate
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  interval: 10m0s
  timeout: 15m0s
  values:
    cronjob:
      schedule: "7 */6 * * *"
      concurrencyPolicy: Forbid
      failedJobsHistoryLimit: 1
      successfulJobsHistoryLimit: 3
    renovate:
      config: |-
        {
          "platform": "gitlab"
        }
      persistence:
        cache:
          enabled: true
          storageClass: ceph-rbd-delete-sc
          storageSize: 5Gi
    resources:
      requests:
        memory: 1792Mi
      limits:
        memory: 3Gi
    envFrom:
    - secretRef:
        name: renovate-secret
    env:
      LOG_LEVEL: info
      NODE_OPTIONS: --max-old-space-size=1024
      RENOVATE_AUTODISCOVER: "true"
      RENOVATE_DETECT_HOST_RULES_FROM_ENV: "true"
      RENOVATE_ONBOARDING: "true"
      RENOVATE_PERSIST_REPO_DATA: "true"
      RENOVATE_PLATFORM: gitlab
      RENOVATE_PR_CONCURRENT_LIMIT: "20"
      RENOVATE_PR_HOURLY_LIMIT: "10"
      RENOVATE_ONBOARDING_CONFIG: |-
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": [
            "config:base",
            ":automergeMinor",
            ":automergePr",
            ":automergeRequireAllStatusChecks",
            ":enablePreCommit"
          ],
          "lockFileMaintenance": {
            "enabled": true,
            "extends": [
              "schedule:weekly"
            ]
          },
          "nix": {
            "enabled": true
          }
        }
      RENOVATE_REPOSITORY_CACHE: enabled
