---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: nextcloud
spec:
  chart:
    spec:
      chart: valkey
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  interval: 10m0s
  timeout: 10m0s
  values:
    deploymentStrategy: Recreate
    dataStorage:
      enabled: true
      requestedSize: 8Gi
    valkeyConfig: |
      appendonly yes
      save ""
      rename-command FLUSHDB ""
      rename-command FLUSHALL ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 150m
        memory: 192Mi
        ephemeral-storage: 2Gi
    metrics:
      enabled: false
    auth:
      enabled: true
      usersExistingSecret: valkey-secret
      aclUsers:
        default:
          permissions: "~* &* +@all"
