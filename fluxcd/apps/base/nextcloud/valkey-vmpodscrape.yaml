---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: valkey
  namespace: nextcloud
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: valkey
  podMetricsEndpoints:
  - port: metrics
    seriesLimit: 500
    metricRelabelConfigs:
    # per command latency and failure stats and exporter internals; keeps
    # per command calls and time for the redis dashboard
    - action: drop
      source_labels: [__name__]
      regex: (redis_commands_(latencies_usec_.*|failed_calls_total|rejected_calls_total)|redis_latency_percentiles_usec.*|redis_errors_total|redis_exporter_.*|redis_target_scrape_.*|.+_bucket|go_.*|promhttp_.*)
