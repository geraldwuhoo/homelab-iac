---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signal
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 10m0s
  timeout: 10m0s
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: dock.mau.dev/mautrix/signal
              tag: v26.09
              pullPolicy: IfNotPresent
            resources:
              requests:
                memory: 48Mi
              limits:
                memory: 128Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 29328
    persistence:
      data:
        suffix: data
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
      signal-config:
        type: secret
        name: signal-config
        globalMounts:
        - path: /data/config.yaml
          subPath: config.yaml
          readOnly: true
        - path: /data/registration.yaml
          subPath: registration.yaml
          readOnly: true
