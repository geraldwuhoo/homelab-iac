---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: directory-listing
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - aur-directory
      - mirror-directory
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx-public
    ports:
    - port: 80
      protocol: TCP
