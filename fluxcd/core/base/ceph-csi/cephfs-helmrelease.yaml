---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-cephfs
  namespace: ceph-csi-cephfs
spec:
  chart:
    spec:
      chart: ceph-csi-cephfs
      version: 3.18.0
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
        namespace: flux-system
  interval: 10m0s
  values:
    csiConfig:
    - clusterID: ${CEPH_CLUSTER_ID}
      monitors:
      - ${CEPH_MON_0}
      - ${CEPH_MON_1}
      - ${CEPH_MON_2}
    provisioner:
      attacher:
        enabled: false
      snapshotter:
        image:
          repository: registry.k8s.io/sig-storage/csi-snapshotter
          tag: v8.6.0
        resources:
          requests:
            memory: 32Mi
      provisioner:
        resources:
          requests:
            memory: 32Mi
      resizer:
        resources:
          requests:
            memory: 32Mi
    nodeplugin:
      plugin:
        resources:
          requests:
            memory: 48Mi
      registrar:
        resources:
          requests:
            memory: 16Mi
