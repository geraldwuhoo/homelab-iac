# The CephFS chart grants VolumeAttachment and CSINode access only when the
# attacher sidecar is enabled. That switch also sets attachRequired on the
# CSIDriver. The attacher stays off so CephFS mounts do not wait for an
# attachment, but ceph-csi 3.18 always advertises ControllerPublishVolume and
# csi-provisioner v6 watches VolumeAttachments before it provisions anything.
# Without these rules that watch is forbidden and CreateVolume never runs.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ceph-csi-cephfs-provisioner-attachments
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ceph-csi-cephfs-provisioner-attachments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ceph-csi-cephfs-provisioner-attachments
subjects:
  - kind: ServiceAccount
    name: ceph-csi-cephfs-provisioner
    namespace: ceph-csi-cephfs
