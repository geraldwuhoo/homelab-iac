---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pod-gateway
spec:
  chart:
    spec:
      chart: pod-gateway
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: angelnu
        namespace: flux-system
  interval: 10m0s
  timeout: 10m0s
  values:
    routed_namespaces:
    - vpn
    controllers:
      main:
        containers:
          gluetun:
            enabled: true
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              VPN_TYPE: wireguard
              VPN_SERVICE_PROVIDER: airvpn
              # pod and service CIDRs; not 10.0.0.0/8, which overlaps the wireguard tunnel address
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16
              DNS_SERVER: "off"
              WIREGUARD_MTU: "1320"
              HTTPPROXY: "on"
              HTTPPROXY_STEALTH: "on"
            envFrom:
            - secretRef:
                name: vpn-secret
            securityContext:
              capabilities:
                add:
                - NET_ADMIN
      webhook:
        containers:
          main:
            image:
              # v3.11.0+ ship an amd64 binary in the arm64 image
              # https://github.com/angelnu/gateway-admision-controller/issues/299
              tag: v3.10.0
    configMaps:
      iptables:
        suffix: iptables
        data:
          # let routed pods on vxlan0 through gluetun's firewall into the tunnel
          post-rules.txt: |
            iptables -A FORWARD -i vxlan0 -o wg0 -j ACCEPT
            iptables -A FORWARD -i wg0 -o vxlan0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
            iptables -A OUTPUT -o vxlan0 -j ACCEPT
    persistence:
      iptables:
        type: configMap
        identifier: iptables
        advancedMounts:
          main:
            gluetun:
            - path: /iptables
              readOnly: true
    networkpolicies:
      main:
        rules:
          egress:
          - to:
            - ipBlock:
                cidr: 0.0.0.0/0
            ports:
            - port: 1637
              protocol: UDP
          - to:
            - namespaceSelector: {}
    service:
      gluetun:
        controller: main
        type: ClusterIP
        ports:
          httpproxy:
            port: 8888
            protocol: TCP
    settings:
      VPN_LOCAL_CIDRS: 10.0.0.0/8 192.168.0.0/16
      NOT_ROUTED_TO_GATEWAY_CIDRS: 10.0.0.0/8 192.168.0.0/16
      IPV4_ENABLED: true
      IPV6_ENABLED: false
