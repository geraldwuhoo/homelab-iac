---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  chart:
    spec:
      chart: volsync
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
  interval: 10m0s
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: ServiceMonitor
          name: volsync
        patch: |
          - op: add
            path: /spec/endpoints/0/bearerTokenFile
            value: /var/run/secrets/kubernetes.io/serviceaccount/token
  values:
    manageCRDs: true
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 1Gi
