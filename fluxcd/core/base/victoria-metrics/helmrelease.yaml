---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.93.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  dependsOn:
  - name: prometheus-operator-crds
  interval: 10m0s
  timeout: 10m0s
  # operator crds ship in a crds/ dir, which helm never upgrades on its own
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: vm
    victoria-metrics-operator:
      crds:
        cleanup:
          enabled: false
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

    # only the builtin prometheus datasource; the vm plugin needs internet on grafana startup
    defaultDatasources:
      victoriametrics:
        datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          uid: VictoriaMetrics
          isDefault: true

    defaultRules:
      groups:
        # these depend on the apiserver histograms dropped below
        kube-apiserver-availability.rules:
          enabled: false
        kube-apiserver-burnrate.rules:
          enabled: false
        kube-apiserver-histogram.rules:
          enabled: false
        kube-apiserver-slos:
          enabled: false

    vmsingle:
      spec:
        retentionPeriod: 30d
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        storage:
          resources:
            requests:
              storage: 20Gi

    vmagent:
      spec:
        scrapeInterval: 30s
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

    vmalert:
      spec:
        evaluationInterval: 30s
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi

    alertmanager:
      spec:
        secrets:
        - alertmanager-ntfy
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      config:
        route:
          receiver: blackhole
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
          - matchers:
            - severity=~"warning|critical"
            receiver: ntfy
        inhibit_rules:
        - source_matchers:
          - severity="critical"
          target_matchers:
          - severity="warning"
          equal: [alertname, namespace]
        receivers:
        - name: blackhole
        - name: ntfy
          webhook_configs:
          - url: https://ntfy.${DOMAIN}/alerts?template=alertmanager
            send_resolved: true
            http_config:
              authorization:
                credentials_file: /etc/vm/secrets/alertmanager-ntfy/token

    grafana:
      admin:
        existingSecret: grafana-admin
      grafana.ini:
        server:
          root_url: https://grafana.${DOMAIN}
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        size: 1Gi
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 384Mi
      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
        - grafana.${DOMAIN}
        # no secretName, so nginx serves the default cert; the chart only
        # builds https alert links to grafana when tls is set
        tls:
        - hosts:
          - grafana.${DOMAIN}
      vmScrape:
        enabled: false

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    kube-state-metrics:
      # replicaset owner is kept for the pod owner recording rules
      metricDenylist:
      - kube_replicaset_(annotations|created|labels|metadata_generation|spec_replicas|status_.*)
      - kube_pod_tolerations
      - kube_pod_status_reason
      - kube_.*_annotations
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    kubelet:
      # each vmScrapes spec replaces vmScrape's metricRelabelConfigs rather
      # than appending, so the shared rules are repeated in each list
      vmScrapes:
        probes:
          enabled: false
        cadvisor:
          spec:
            path: /metrics/cadvisor
            metricRelabelConfigs:
            # non-pod cgroups; node level usage comes from node-exporter
            - action: drop
              source_labels: [namespace]
              regex: ""
            - action: drop
              source_labels: [__name__]
              regex: (container_tasks_state|container_memory_failures_total|container_blkio_device_usage_total|container_fs_(inodes_.*|io_.*|reads_merged_total|writes_merged_total|sector_.*|limit_bytes)|container_memory_(failcnt|mapped_file|kernel_usage|total_active_file_bytes|total_inactive_file_bytes)|container_(ulimits_soft|processes|threads|threads_max|sockets|file_descriptors|last_seen|start_time_seconds|spec_.*))
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        kubelet:
          spec:
            metricRelabelConfigs:
            # k3s serves the whole apiserver registry on the masters' kubelet
            # /metrics too; the apiserver job already scrapes these
            - action: drop
              source_labels: [__name__]
              regex: (apiserver_.*|etcd_.*)
            # keep only the histograms the kubelet rules and dashboard use
            - action: drop
              if: '{__name__=~".+_bucket",__name__!~"kubelet_(pleg_relist|pod_worker|pod_start)_duration_seconds_bucket"}'
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
      vmScrape:
        spec:
          # chart defaults, used as is by the resources scrape
          metricRelabelConfigs:
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            source_labels: [__name__]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: https
            scheme: https
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
            # histograms are most of the series, times three masters; rates
            # and error counts are kept
            metricRelabelConfigs:
            - action: drop
              source_labels: [__name__]
              regex: (.+_bucket|workqueue_.*)

    # k3s runs these in one process with the apiserver, and the nixos firewall
    # blocks their metrics ports on the masters anyway
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
