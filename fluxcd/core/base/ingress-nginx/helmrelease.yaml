---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  chart:
    spec:
      chart: ingress-nginx
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      version: 4.11.5
  interval: 10m0s
  values:
    controller:
      enableAnnotationValidations: false
      podAnnotations:
        linkerd.io/inject: enabled
        # vmagent scrapes the metrics port directly. linkerd would otherwise
        # require the scrape to present a mesh identity
        config.linkerd.io/skip-inbound-ports: "10254"
      config:
        enable-brotli: true
        brotli-level: "6"
        use-gzip: true
        # deny all crawlers on every host. added to every server block, so an
        # ingress must not define its own /robots.txt location, or nginx
        # rejects the whole config
        server-snippet: |
          location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
          }
      kind: Deployment
      replicaCount: 2
      # chart default; keeps a drain or rollout from taking the last pod
      minAvailable: 1
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        type: RollingUpdate
      affinity:
        podAntiAffinity:
          # preferred so a one-node cluster can still place both pods
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/component: controller
      allowSnippetAnnotations: true
      setAsDefaultIngress: true
      ingressClassResource:
        default: true
      watchIngressWithoutClass: true
      extraArgs:
        default-ssl-certificate: "cert-manager/${LETSENCRYPT_CERT}"
      service:
        loadBalancerIP: ${INGRESS_IP}
      resources:
        requests:
          cpu: 75m
          memory: 128Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
          namespace: prometheus
          additionalLabels:
            release: prometheus
