# The CephFS provisioner does not create volumes on this cluster, so this is a
# static mount of /volumes/nas/anubis-geoip. The storage class matches the
# claim; the provisioner parameters are not used.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: anubis-geoip
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 1Gi
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: default
    volumeAttributes:
      "clusterID": "${CEPH_CLUSTER_ID}"
      "fsName": "cephfs"
      "staticVolume": "true"
      "rootPath": /volumes/nas/anubis-geoip
    volumeHandle: anubis-geoip
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ceph-cephfs-ssd-sc
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anubis-geoip
  labels:
    no-backup: "true"
  annotations:
    k8up.io/backup: "false"
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      # The two DB-IP Lite files are about 20MiB.
      storage: 1Gi
  volumeMode: Filesystem
  storageClassName: ceph-cephfs-ssd-sc
  volumeName: anubis-geoip
