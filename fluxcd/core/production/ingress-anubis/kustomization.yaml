---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingress-anubis
resources:
- ../../base/ingress-anubis
configMapGenerator:
- name: anubis-policy
  files: [botPolicies.yaml]
  options:
    # referenced by name inside the VOLUMES string below
    disableNameSuffixHash: true
patches:
- target:
    kind: HelmRelease
    name: ingress-anubis
  patch: |-
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: ingress-anubis
    spec:
      values:
        config:
          WRAPPED_INGRESS_CLASS_NAME: nginx-public
          # anubis strips private IPs from X-Forwarded-For by default, so gitlab
          # sees every in-cluster client (runners, keel) as the anubis pod
          ENVIRONMENT_VARIABLES: POLICY_FNAME:/etc/anubis/botPolicies.yaml,XFF_STRIP_PRIVATE:false
          VOLUMES: '[{"name":"anubis-policy","configMap":{"name":"anubis-policy"}}]'
          VOLUME_MOUNTS: '[{"name":"anubis-policy","mountPath":"/etc/anubis","readOnly":true}]'
