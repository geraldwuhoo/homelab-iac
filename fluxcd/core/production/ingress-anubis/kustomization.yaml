---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingress-anubis
resources:
- ../../base/ingress-anubis
patches:
- target:
    kind: HelmRelease
    name: ingress-anubis
  patch: |-
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: ingress-anubis
    spec:
      values:
        config:
          WRAPPED_INGRESS_CLASS_NAME: nginx-public
