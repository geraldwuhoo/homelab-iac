---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingress-anubis
resources:
- ../../base/ingress-anubis
- geoip-pvc.yaml
- geoip-sync.yaml
- geoip-netpol.yaml
configMapGenerator:
- name: anubis-policy
  files:
  - botPolicies.yaml
  - cloud-alibaba.yaml
  - cloud-aws-ec2.yaml
  - cloud-byteplus.yaml
  - cloud-colocrossing.yaml
  - cloud-contabo.yaml
  - cloud-datacamp.yaml
  - cloud-digitalocean.yaml
  - cloud-dmzhost.yaml
  - cloud-egihosting.yaml
  - cloud-hetzner.yaml
  - cloud-m247.yaml
  - cloud-nebula.yaml
  - cloud-oracle.yaml
  - cloud-ovh.yaml
  - cloud-selectel.yaml
  - cloud-tc-datacenter.yaml
  - cloud-tencent.yaml
  - cloud-vpsdedicated.yaml
  options:
    # referenced by name inside the VOLUMES string below
    disableNameSuffixHash: true
patches:
- target:
    kind: HelmRelease
    name: ingress-anubis
  patch: |-
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: ingress-anubis
    spec:
      values:
        config:
          WRAPPED_INGRESS_CLASS_NAME: nginx-public
          ENVIRONMENT_VARIABLES: POLICY_FNAME:/etc/anubis/botPolicies.yaml
          VOLUMES: '[{"name":"anubis-policy","configMap":{"name":"anubis-policy"}},{"name":"anubis-geoip","persistentVolumeClaim":{"claimName":"anubis-geoip","readOnly":true}}]'
          VOLUME_MOUNTS: '[{"name":"anubis-policy","mountPath":"/etc/anubis","readOnly":true},{"name":"anubis-geoip","mountPath":"/var/lib/geoip","readOnly":true}]'
