# Anubis policy for production. This is Anubis' default policy with two changes:
#
# - ordinary browsers (weight 10) get difficulty 4 instead of 2. The DIFFICULTY
#   env var and the difficulty annotation have no effect here: every challenge
#   comes from a threshold below, and each threshold sets its own difficulty.
# - browser-like clients on the tracked hosting networks get 10 extra weight,
#   landing them in mild-proof-of-work (difficulty 6 instead of 4). That
#   averaged 30s on a desktop. AirVPN, IVPN, and nearly all tor exits are
#   outside these ranges. Non-browser user agents (git, renovate, runners)
#   are unaffected.
#
# The default policy weighs networks via Thoth, a paid lookup service we don't
# use, so each cloud-*.yaml matches one network's address ranges directly, with
# its source in its header. Refresh them every few months.
# Anubis loads these files at startup: restart ia-* deployments after changing them.
#
# The databases below turn on two WEIGH rules from the imported default policy.
# Neither rule denies anyone:
# - Brazil and China get +10, so a plain browser there is difficulty 6.
# - AS13335 (Cloudflare, including WARP), AS136907 (Huawei Cloud) and AS45102
#   (Alibaba Cloud) get +10. Alibaba and Huawei addresses already covered by
#   the built-in deny lists are still denied, because that rule runs first.
# anubis-geoip downloads DB-IP Lite and renames the files into place. A running
# pod keeps the database it opened; the next restart picks up a newer one.
geoip:
  asn:
    path: /var/lib/geoip/dbip-asn-lite.mmdb
  country:
    path: /var/lib/geoip/dbip-country-lite.mmdb
bots:
- import: (data)/meta/default-config.yaml
- import: /etc/anubis/cloud-alibaba.yaml
- import: /etc/anubis/cloud-aws-ec2.yaml
- import: /etc/anubis/cloud-byteplus.yaml
- import: /etc/anubis/cloud-digitalocean.yaml
- import: /etc/anubis/cloud-tencent.yaml
- import: /etc/anubis/cloud-colocrossing.yaml
- import: /etc/anubis/cloud-contabo.yaml
- import: /etc/anubis/cloud-datacamp.yaml
- import: /etc/anubis/cloud-dmzhost.yaml
- import: /etc/anubis/cloud-egihosting.yaml
- import: /etc/anubis/cloud-hetzner.yaml
- import: /etc/anubis/cloud-m247.yaml
- import: /etc/anubis/cloud-nebula.yaml
- import: /etc/anubis/cloud-oracle.yaml
- import: /etc/anubis/cloud-ovh.yaml
- import: /etc/anubis/cloud-selectel.yaml
- import: /etc/anubis/cloud-tc-datacenter.yaml
- import: /etc/anubis/cloud-vpsdedicated.yaml

# every challenge difficulty comes from these; moderate-suspicion (2 -> 4) and
# mild-proof-of-work (4 -> 6) differ from the default policy
thresholds:
- name: minimal-suspicion
  expression: weight <= 0
  action: ALLOW
- name: mild-suspicion
  expression:
    all:
    - weight > 0
    - weight < 10
  action: CHALLENGE
  challenge:
    algorithm: metarefresh
    difficulty: 1
- name: moderate-suspicion
  expression:
    all:
    - weight >= 10
    - weight < 20
  action: CHALLENGE
  challenge:
    algorithm: fast
    difficulty: 4
- name: mild-proof-of-work
  expression:
    all:
    - weight >= 20
    - weight < 30
  action: CHALLENGE
  challenge:
    algorithm: fast
    difficulty: 6
- name: extreme-suspicion
  expression: weight >= 30
  action: CHALLENGE
  challenge:
    algorithm: fast
    difficulty: 6
