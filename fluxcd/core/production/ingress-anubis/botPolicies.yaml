# every challenge difficulty comes from these; moderate-suspicion (2 -> 4) and
# mild-proof-of-work (4 -> 5) differ from the default policy
thresholds:
- name: minimal-suspicion
  expression: weight <= 0
  action: ALLOW
- name: mild-suspicion
  expression:
    all:
    - weight > 0
    - weight < 10
  action: CHALLENGE
  challenge:
    algorithm: metarefresh
    difficulty: 1
- name: moderate-suspicion
  expression:
    all:
    - weight >= 10
    - weight < 20
  action: CHALLENGE
  challenge:
    algorithm: fast
    difficulty: 4
- name: mild-proof-of-work
  expression:
    all:
    - weight >= 20
    - weight < 30
  action: CHALLENGE
  challenge:
    algorithm: fast
    difficulty: 5
- name: extreme-suspicion
  expression: weight >= 30
  action: CHALLENGE
  challenge:
    algorithm: fast
    difficulty: 6
