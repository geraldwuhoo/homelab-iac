# Anubis policy for production. This is Anubis' default policy with two changes:
#
# - ordinary browsers (weight 10) get difficulty 4 instead of 2. The DIFFICULTY
#   env var and the difficulty annotation have no effect here: every challenge
#   comes from a threshold below, and each threshold sets its own difficulty.
# - browser-like clients on the cloud networks that scrape gitlab get 10 extra
#   weight, landing them in mild-proof-of-work (difficulty 5 instead of 4).
#   Difficulty 6 averaged 30s on a desktop, too slow for humans on a VPN.
#   Non-browser user agents (git, renovate, runners) from these networks are
#   unaffected.
#
# The default policy weighs these networks via Thoth, a paid lookup service we
# don't use, so we match their announced prefixes directly. Refresh the lists
# from RIPEstat every few months:
#   https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS<asn>
# Anubis loads this file at startup: restart ia-* deployments after changing it.
bots:
- import: (data)/meta/default-config.yaml
- name: scraper-cloud-networks
  action: WEIGH
  user_agent_regex: >-
    Mozilla|Opera
  weight:
    adjust: 10
  remote_addresses:
